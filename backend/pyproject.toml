[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
  "pydantic>=2.6.0",
  "pydantic-settings>=2.2.1",
  "python-jose[cryptography]>=3.3.0",
  "httpx>=0.27.0",
  "PyJWT>=2.9.0",

  "SQLAlchemy>=2.0.0",
  "psycopg[binary]>=3.1.0",
  "alembic>=1.13.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
  "app*",
  "api*",
  "core*",
  "db*",
  "schemas*"
]

[tool.alembic]
script_location = "alembic"

[tool.pyright]
typeCheckingMode = "basic"